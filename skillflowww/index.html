<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkillFlow - Learn with Momentum</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-white min-h-screen flex flex-col relative overflow-x-hidden">

    <!-- UX EXPLAINER TOGGLE (Keep this for presentation) -->
    <div class="fixed top-4 right-4 z-50 flex items-center space-x-2 bg-white/90 backdrop-blur p-2 rounded-lg border border-slate-200 shadow-sm">
        <span class="text-xs font-bold text-slate-500 uppercase tracking-wide">Explain UX</span>
        <input type="checkbox" id="hotspot-toggle" class="w-4 h-4 accent-green-600 cursor-pointer" onchange="toggleHotspots(this)">
    </div>

    <!-- HOTSPOT -->
    <div class="hotspot hidden absolute top-[40%] left-[15%] w-8 h-8 bg-green-500 rounded-full flex items-center justify-center text-white font-bold cursor-pointer animate-pulse z-40 shadow-[0_0_0_10px_rgba(34,197,94,0.2)]" onclick="alert('UX INSIGHT: Value-Driven Hook.\n\nProblem: Generic portals feel like databases.\nSolution: We promise a specific outcome (getting hired) to trigger intrinsic motivation immediately.')">?</div>

    <!-- DECORATIVE BACKGROUND -->
    <div class="absolute top-0 right-0 w-1/2 h-full bg-gradient-to-l from-green-50 to-transparent pointer-events-none -z-10"></div>

    <!-- NAV -->
    <nav class="p-6 flex justify-between items-center max-w-7xl mx-auto w-full">
        <div class="flex items-center space-x-2 text-green-700 font-bold text-xl">
            <i data-lucide="zap" class="fill-current"></i> <span>SkillFlow</span>
        </div>
        <a href="login.html" class="text-slate-600 font-medium hover:text-green-700 transition-colors">Log In</a>
    </nav>

    <!-- HERO SECTION -->
    <main class="flex-1 flex items-center justify-center p-10">
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-12 max-w-6xl w-full items-center">
            
            <!-- LEFT CONTENT -->
            <div>
                <div class="inline-block bg-green-100 text-green-800 text-xs font-bold px-3 py-1 rounded-full mb-6">New: AI Career Tracks</div>
                <h1 class="text-5xl lg:text-6xl font-extrabold text-slate-900 mb-6 leading-tight">Learn the one skill that gets you <span class="text-green-600">hired.</span></h1>
                <p class="text-lg text-slate-500 mb-8 max-w-md">Stop browsing aimlessly. Pick a career path, stick to a 7-day plan, and see real results.</p>
                
                <div class="flex space-x-4">
                    <a href="signup.html" class="bg-green-600 text-white px-8 py-4 rounded-xl font-bold shadow-lg shadow-green-200 hover:bg-green-700 transition-all transform hover:-translate-y-1 inline-block text-center">Start Learning Now</a>
                    <button class="px-8 py-4 rounded-xl font-bold text-slate-600 hover:bg-slate-50">View Syllabus</button>
                </div>

                <div class="mt-8 flex items-center space-x-4 text-sm text-slate-400">
                    <div class="flex -space-x-2">
                        <div class="w-8 h-8 rounded-full bg-slate-200 border-2 border-white"></div>
                        <div class="w-8 h-8 rounded-full bg-slate-300 border-2 border-white"></div>
                        <div class="w-8 h-8 rounded-full bg-slate-400 border-2 border-white"></div>
                    </div>
                    <span>Join 10,000+ students today</span>
                </div>
            </div>

            <!-- RIGHT IMAGE -->
            <div class="relative hidden lg:block">
                <div class="absolute -inset-4 bg-green-200 rounded-full blur-3xl opacity-30"></div>
                <img src="https://images.unsplash.com/photo-1522202176988-66273c2fd55f?auto=format&fit=crop&w=800&q=80" class="relative rounded-2xl shadow-2xl transform rotate-2 hover:rotate-0 transition-transform duration-500">
            </div>
        </div>
    </main>

    <script>
        lucide.createIcons();
        function toggleHotspots(cb) {
            const el = document.querySelector('.hotspot');
            if(cb.checked) el.classList.remove('hidden');
            else el.classList.add('hidden');
        }
    </script>
</body>
</html>
