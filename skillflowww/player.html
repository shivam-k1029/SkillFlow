<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkillFlow - Learning</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-slate-50 min-h-screen flex flex-col overflow-hidden">

    <!-- UX EXPLAINER -->
    <div class="fixed top-4 right-4 z-50 flex items-center space-x-2 bg-white/90 backdrop-blur p-2 rounded-lg border border-slate-200 shadow-sm">
        <span class="text-xs font-bold text-slate-500 uppercase tracking-wide">Explain UX</span>
        <input type="checkbox" id="hotspot-toggle" class="w-4 h-4 accent-green-600 cursor-pointer" onchange="toggleHotspots(this)">
    </div>

    <!-- HOTSPOT -->
    <div class="hotspot hidden absolute bottom-[100px] left-[10%] w-8 h-8 bg-green-500 rounded-full flex items-center justify-center text-white font-bold cursor-pointer animate-pulse z-40 shadow-[0_0_0_10px_rgba(34,197,94,0.2)]" onclick="alert('UX INSIGHT: Visual Milestones.\n\nProblem: A solid 60-minute bar looks exhausting.\nSolution: Chunking the progress bar makes the video feel like a series of small, achievable sprints.')">?</div>

    <!-- TOP BAR -->
    <div class="h-16 bg-white flex items-center px-8 border-b border-slate-200 justify-between shrink-0">
        <div class="flex items-center">
            <button onclick="window.location.href='dashboard.html'" class="w-8 h-8 rounded-full bg-slate-100 flex items-center justify-center mr-4 hover:bg-slate-200 transition-colors">
                <i data-lucide="arrow-left" class="w-4 h-4 text-slate-600"></i>
            </button>
            <span class="font-bold text-slate-800">Deep Dive into Algorithms</span>
            <span class="mx-3 text-slate-300">|</span>
            <span class="text-sm text-slate-500">Chapter 1: The Basics</span>
        </div>
        <div class="px-3 py-1 bg-green-100 text-green-700 text-xs font-bold rounded-full flex items-center">
            <i data-lucide="flame" class="w-3 h-3 mr-1"></i> Streak Active
        </div>
    </div>

    <!-- PLAYER AREA -->
    <div class="flex-1 flex overflow-hidden">
        
        <!-- VIDEO -->
        <div class="flex-1 bg-slate-900 flex flex-col justify-center items-center relative p-8">
            <div class="w-full max-w-5xl aspect-video bg-black relative rounded-xl shadow-2xl overflow-hidden group">
                <img src="https://images.unsplash.com/photo-1516116216624-53e697fedbea?auto=format&fit=crop&w=1200" class="absolute inset-0 w-full h-full object-cover opacity-50">
                
                <!-- Play Button -->
                <div class="absolute inset-0 flex items-center justify-center">
                    <button class="w-20 h-20 bg-white/20 backdrop-blur rounded-full flex items-center justify-center hover:scale-110 transition-transform">
                        <i data-lucide="pause" class="w-8 h-8 text-white fill-current"></i>
                    </button>
                </div>

                <!-- SEGMENTED CONTROLS -->
                <div class="absolute bottom-0 left-0 w-full p-6 bg-gradient-to-t from-black/80 to-transparent">
                    <div class="flex justify-between text-xs font-bold text-white mb-2">
                        <span>Intro</span>
                        <span class="text-green-400">Next Checkpoint: 3 mins</span>
                    </div>
                    <div class="flex space-x-1 h-2 w-full">
                        <div class="flex-1 bg-green-500 rounded-l-full"></div> <!-- Completed -->
                        <div class="flex-1 bg-green-500"></div> <!-- Completed -->
                        <div class="flex-1 bg-white/30 relative overflow-hidden"> <!-- Current -->
                            <div class="absolute top-0 left-0 h-full bg-white w-[40%]"></div>
                        </div> 
                        <div class="flex-1 bg-white/30"></div>
                        <div class="flex-1 bg-white/30 rounded-r-full"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- SIDEBAR (Content) -->
        <div class="w-96 bg-white border-l border-slate-200 flex flex-col hidden xl:flex">
            <div class="p-6 border-b border-slate-100">
                <h3 class="font-bold text-slate-800">Lesson Segments</h3>
                <p class="text-xs text-slate-400 mt-1">Completion saves automatically at checkpoints.</p>
            </div>
            <div class="flex-1 overflow-y-auto p-4 space-y-3">
                <div class="p-4 rounded-xl bg-green-50 border border-green-100 flex items-center space-x-3">
                    <div class="w-6 h-6 rounded-full bg-green-200 flex items-center justify-center text-green-700"><i data-lucide="check" class="w-3 h-3"></i></div>
                    <div>
                        <p class="text-sm font-bold text-slate-800">1. Why Algorithms Matter</p>
                        <p class="text-xs text-slate-500">completed</p>
                    </div>
                </div>
                <div class="p-4 rounded-xl bg-white border-l-4 border-green-500 shadow-sm flex items-center space-x-3">
                    <div class="w-6 h-6 rounded-full border-2 border-green-500 flex items-center justify-center"><div class="w-2 h-2 bg-green-500 rounded-full animate-pulse"></div></div>
                    <div>
                        <p class="text-sm font-bold text-green-700">2. Big O Notation</p>
                        <p class="text-xs text-green-500 font-bold">Current • 3m left</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        lucide.createIcons();
        function toggleHotspots(cb) {
            const el = document.querySelector('.hotspot');
            if(cb.checked) el.classList.remove('hidden');
            else el.classList.add('hidden');
        }
    </script>
</body>
</html>
